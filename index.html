<!DOCTYPE html>
<html class='webpage' id='html-id'>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>SearchCord V1</title>
    <link rel = 'stylesheet' type = 'text/css' href = 'style.css'>
    <script scr = 'script.js'></script>
    <link
      href="https://fonts.googleapis.com/css?family=Comfortaa"
      rel="stylesheet"
    />
  </head>
  
  <body>

    <div class='container'>
      <div class='top-container' id='top-container-id'>
        <div class='top-user-images'>
          <img class='rose-top-pfp' src="https://i.pinimg.com/564x/62/35/fa/6235fa5ab095da7d6615f6e2d847fcf6.jpg" alt="rose-shock-pfp" aria-hidden="false">
          <img class='rose-bottom-pfp' src="https://i.pinimg.com/564x/ab/19/61/ab196161dab0693ede46482b12d79159.jpg" alt="rose-pfp" aria-hidden="true">
        </div>
        <div class='top-user-texts'>
          <span class='user-pfp-text' id='user-pfp-text-id'>
            SearchCord ~
          </span>
          <span class='rose-user-icon'>
            🌸
          </span>
        </div>
        <div class='top-user-icons'>
          <span class='user-info-icon'>
            🌸
          </span>
        </div>
        <div class='top-user-lightdark-mode'>
          <button class='light-mode-button' onclick="lightMode()">
            <img class='light-mode-img' id='light-mode-img-id' src="https://cdn-icons-png.flaticon.com/512/10562/10562157.png">
          </button>
          <button class='dark-mode-button' onclick="darkMode()">
            <img class='dark-mode-img' id='dark-mode-img-id' src="https://cdn-icons-png.flaticon.com/512/5043/5043094.png">
          </button>
        </div>
        <div class='top-container-description'>
          <span class='rose-title' id='rose-title-id'>SearchCord ~</span>
          <span class='rose-description' id='rose-description-id'>
            An aesthetic Anime bot made to do almost anything!
            Want to check out an Anime? Use me!
            Use /help for all available commands :D
          </span>
        </div>
      </div>
      <div class='bottom-container'>
        <div class='invite-button'>
          <button class='invite-rose-button' id='invite-rose-button-id'>
            <a class='rose-invite-link' href="https://discord.com/oauth2/authorize?client_id=1243330934498132050&permissions=277293853702&integration_type=0&scope=bot">
              <span class='rose-invite-text' id='rose-invite-text-id'>Invite Rose ~</span>
            </a>
          </button>
          <button class='invite-rose-server-button' id='invite-rose-server-button-id'>
            <a class='server-link' href ='https://discord.gg/Xcgh9MvjuD'>
              <span class='rose-server-invite-text' id='rose-server-invite-text-id'>Join The Server!</span>
            </a>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
